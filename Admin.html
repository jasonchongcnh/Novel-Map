<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1.0, width=device-width">
    <title>影片審批後台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --panel-border: #cbd5e1;
            --panel-highlight: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.25);
            --accent-secondary: #6366f1;
            --approve: #059669;
            --reject: #dc2626;
            --shadow-lg: 0 20px 40px -8px rgba(100, 116, 139, 0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --anim-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            background:
                linear-gradient(rgba(248, 250, 252, 0.78), rgba(248, 250, 252, 0.86)),
                url("https://webst01.is.autonavi.com/appmaptile?style=7&x=267208&y=116510&z=18");
            background-color: var(--bg-deep);
            background-size: 256px 256px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.05), transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .topbar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: min(1120px, calc(100vw - 48px));
            margin: 24px auto 0;
            padding: 20px 24px;
            border-radius: var(--radius-lg);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: slideInLeft 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        .title {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link,
        .button {
            min-height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--panel-border);
            background: #ffffff;
            color: var(--text-main);
            font: inherit;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            padding: 9px 14px;
            cursor: pointer;
            transition: var(--anim-speed);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .link:hover,
        .button:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .button.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        .button.approve {
            background: var(--approve);
            border-color: var(--approve);
            color: #fff;
        }

        .button.reject {
            background: var(--reject);
            border-color: var(--reject);
            color: #fff;
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        main {
            position: relative;
            z-index: 1;
            width: min(1120px, calc(100vw - 32px));
            margin: 24px auto 40px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .login {
            max-width: 420px;
            margin: 56px auto;
            padding: 32px;
            border-radius: var(--radius-lg);
            animation: fadeIn 0.6s 0.1s forwards;
            opacity: 0;
        }

        .login h2 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .hint {
            margin: 0 0 22px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .field {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input {
            width: 100%;
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font: inherit;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: var(--anim-speed);
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            padding: 20px 24px;
            border-radius: var(--radius-lg);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .toolbar-title {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 20px;
            color: var(--accent-primary);
            font-size: 13px;
            font-weight: 600;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-primary);
            box-shadow: 0 0 8px var(--accent-glow);
            animation: pulse 2s infinite;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            overflow: hidden;
            animation: fadeIn 0.5s forwards;
        }

        .card video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #020617;
            object-fit: contain;
        }

        .card-body {
            padding: 16px;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.05), transparent);
        }

        .card h3 {
            margin: 0 0 8px;
            font-size: 18px;
            color: var(--text-main);
        }

        .meta {
            margin: 0 0 12px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .empty {
            padding: 42px 24px;
            text-align: center;
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }

        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.4);
                opacity: 0.4;
                box-shadow: 0 0 12px var(--accent-primary);
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }

        @media (max-width: 640px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 16px;
                width: calc(100vw - 32px);
                margin-top: 16px;
            }

            .nav {
                width: 100%;
            }

            .link,
            .button {
                flex: 1;
                text-align: center;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 18px;
            }

            .toolbar .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div>
            <h1 class="title">影片審批後台</h1>
            <p class="subtitle">澳門全息地圖內容審核</p>
        </div>
        <nav class="nav">
            <a class="link" href="Holo-Map.html">返回地圖</a>
            <button class="button hidden" id="signOutBtn">登出</button>
        </nav>
    </header>

    <main>
        <section class="panel login hidden" id="loginPanel">
            <h2>管理員登入</h2>
            <p class="hint">使用已加入 Supabase admin_users 的管理員帳戶審批影片。</p>
            <form id="loginForm">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button class="button primary" type="submit" id="loginBtn">登入</button>
            </form>
        </section>

        <section class="hidden" id="reviewPanel">
            <div class="toolbar">
                <div>
                    <div class="toolbar-title">
                        <h2 class="title">待審批影片</h2>
                        <div class="status" id="reviewStatus">載入中...</div>
                    </div>
                </div>
                <button class="button" id="refreshBtn">重新整理</button>
            </div>
            <div class="grid" id="videoGrid"></div>
            <div class="panel empty hidden" id="emptyState">目前沒有待審批影片。</div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const loginPanel = document.getElementById('loginPanel');
        const reviewPanel = document.getElementById('reviewPanel');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const reviewStatus = document.getElementById('reviewStatus');
        const videoGrid = document.getElementById('videoGrid');
        const emptyState = document.getElementById('emptyState');

        function setStatus(message) {
            reviewStatus.textContent = message;
        }

        function showLogin() {
            loginPanel.classList.remove('hidden');
            reviewPanel.classList.add('hidden');
            signOutBtn.classList.add('hidden');
        }

        function showReview() {
            loginPanel.classList.add('hidden');
            reviewPanel.classList.remove('hidden');
            signOutBtn.classList.remove('hidden');
        }

        function renderVideos(videos) {
            videoGrid.innerHTML = '';
            emptyState.classList.toggle('hidden', videos.length !== 0);

            videos.forEach((video) => {
                const card = document.createElement('article');
                card.className = 'panel card';

                const createdAt = video.created_at ? new Date(video.created_at).toLocaleString() : '未知時間';
                const description = video.description || '沒有描述';
                const coords = `${Number(video.lat).toFixed(6)}, ${Number(video.lng).toFixed(6)}`;

                card.innerHTML = `
                    <video controls preload="metadata"></video>
                    <div class="card-body">
                        <h3></h3>
                        <p class="meta"></p>
                        <p class="meta"></p>
                        <div class="actions">
                            <button class="button approve" data-action="approved">通過</button>
                            <button class="button reject" data-action="rejected">拒絕</button>
                        </div>
                    </div>
                `;

                card.querySelector('video').src = video.video_url;
                card.querySelector('h3').textContent = video.title || '全息定位影片';
                const metaBlocks = card.querySelectorAll('.meta');
                metaBlocks[0].textContent = description;
                metaBlocks[1].textContent = `${coords} / ${createdAt}`;

                card.querySelectorAll('[data-action]').forEach((button) => {
                    button.addEventListener('click', async () => {
                        await updateStatus(video.id, button.dataset.action, card);
                    });
                });

                videoGrid.appendChild(card);
            });
        }

        async function loadPendingVideos() {
            try {
                setStatus('載入中...');
                const videos = await window.HoloMapAPI.fetchPendingVideos();
                renderVideos(videos);
                setStatus(`共 ${videos.length} 條待審批`);
            } catch (err) {
                console.error(err);
                setStatus('載入失敗: ' + err.message);
                if (err.message.toLowerCase().includes('permission')) {
                    alert('此帳戶沒有審批權限，請確認它已加入 admin_users。');
                }
            }
        }

        async function updateStatus(id, status, card) {
            const buttons = card.querySelectorAll('button');
            buttons.forEach((button) => button.disabled = true);

            try {
                await window.HoloMapAPI.updateVideoStatus(id, status);
                card.remove();
                const remaining = videoGrid.querySelectorAll('.card').length;
                emptyState.classList.toggle('hidden', remaining !== 0);
                setStatus(`共 ${remaining} 條待審批`);
            } catch (err) {
                console.error(err);
                alert('更新失敗: ' + err.message);
                buttons.forEach((button) => button.disabled = false);
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginBtn.disabled = true;
            loginBtn.textContent = '登入中...';

            try {
                await window.HoloMapAPI.signInAdmin(
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                showReview();
                await loadPendingVideos();
            } catch (err) {
                alert('登入失敗: ' + err.message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登入';
            }
        });

        signOutBtn.addEventListener('click', async () => {
            await window.HoloMapAPI.signOutAdmin();
            showLogin();
        });

        refreshBtn.addEventListener('click', loadPendingVideos);

        (async function init() {
            const user = await window.HoloMapAPI.getCurrentUser();
            if (user) {
                showReview();
                await loadPendingVideos();
            } else {
                showLogin();
            }
        })();
    </script>
</body>

</html>
