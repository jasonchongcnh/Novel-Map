<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>澳門全息地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
    html,body,#container{
      height:100%;
      width:100%;
      margin:0
    }
    body{
      font-family:Inter,"Noto Sans CJK TC",sans-serif;
      color:#0f172a;
      overflow:hidden
    }
    body.simplified-chinese-font,
    body.simplified-chinese-font *{
      font-family:Inter,"Microsoft YaHei",sans-serif
    }
    #container{
      background:#e2e8f0
    }
    .panel,.legend{
      position:absolute;
      z-index:1000;
      background:rgba(255,255,255,.95);
      border:1px solid #cbd5e1;
      border-radius:16px;
      box-shadow:0 12px 32px #64748b33;
      padding:20px
    }
    .panel{
      top:24px;
      left:24px;
      width:360px;
      max-height:calc(100svh - 88px);
      overflow-y:auto
    }
    .legend{
      top:24px;
      right:24px
    }
    .panel h1{
      margin:0 0 8px 36px;
      font-size:26px
    }
    .panel p{
      color:#475569;
      line-height:1.5
    }
    .location{
      padding:12px;
      background:#f1f5f9;
      border-radius:10px;
      line-height:1.7
    }
    .action{
      display:block;
      text-align:center;
      margin-top:14px;
      padding:10px;
      border-radius:8px;
      background:#0ea5e9;
      color:#fff;
      text-decoration:none
    }
    .locate{
      margin-top:10px;
      width:100%;
      padding:10px;
      border:0;
      border-radius:8px;
      background:#334155;
      color:#fff;
      cursor:pointer
    }
    .status-link{
      display:block;
      margin-top:8px;
      padding:10px;
      text-align:center;
      color:#0284c7;
      line-height:1.5
    }
    .lang-toggle{
      display:none;
      padding:8px 12px;
      border:1px solid #cbd5e1;
      border-radius:999px;
      background:#fff;
      color:#0f172a;
      cursor:pointer;
      box-shadow:0 8px 24px #64748b22;
      font-family:inherit
    }
    .language-control.open .lang-toggle{
      display:block
    }
    .language-label{
      padding:8px 12px;
      border:1px solid #cbd5e1;
      border-radius:999px;
      background:#fff;
      color:#0f172a;
      cursor:pointer;
      box-shadow:0 8px 24px #64748b22;
      font:inherit;
      font-weight:600
    }
    .language-control{
      position:absolute;
      right:24px;
      top:175px;
      z-index:1001;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px
    }
    .language-label{
      color:#0f172a;
      font-size:16px;
      font-weight:600
    }
    .legend div{
      margin:6px
    }
    .pin{
      width:24px;
      height:32px;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid #fff;
      box-shadow:0 2px 5px #0006
    }
    .pin i{
      display:block;
      width:8px;
      height:8px;
      margin:6px;
      background:#020617;
      border-radius:50%
    }
    .user-pin{
      width:18px;
      height:18px;
      border-radius:50%;
      background:#2563eb;
      border:3px solid #fff;
      box-shadow:0 0 0 5px #2563eb55,0 2px 6px #0008
    }
    .leaflet-popup-content{
      margin:0
    }
    .card{
      width:300px;
      overflow:hidden
    }
    .card h3{
      margin:0;
      padding:12px 16px;
      border-bottom:1px solid #e2e8f0
    }
    .card section{
      padding:12px 16px;
      color:#475569
    }
    .card img,.card video{
      max-width:100%;
      max-height:180px;
      border-radius:8px
    }
    .tag{
      font-size:11px;
      color:#0284c7
    }
    .info-row{display:flex;align-items:center;gap:8px;margin-top:8px}
    .phone{font-weight:600;color:#0f172a}
    .like-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:14px}
    .like-btn.liked{background:#ffe4e6;border-color:#fda4af}
    .like-btn:disabled{opacity:.75;cursor:default}
    .like-count{font-weight:600}
    @media(max-width:600px){
      .panel{
        left:12px;
        right:12px;
        bottom:12px;
        top:auto;
        width:auto;
        max-height:calc(100svh - 64px)
      }
      .legend{
        top:12px;
        right:12px;
        padding:10px;
        font-size:12px
      }
      .leaflet-control-zoom{
        position:absolute;
        top:12px;
        left:12px
      }
      .language-control{
        top:100px;
        left:12px;
        right:auto;
        align-items:flex-start
      }
    }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div class="language-control">
      <button class="language-label" id="languageLabel" type="button" aria-expanded="false">語言</button>
      <select class="lang-toggle" id="langToggle" aria-label="語言">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </div>
    <section class="panel">
      <h1 id="pageTitle">澳門全息地圖</h1>
      <p id="pageSubtitle">基於高斯濺射與北斗衛星導航系統的新型全息地圖體驗</p>
      <div class="location" id="result">正在獲取您的當前位置...</div>
      <button class="locate" id="locateBtn" type="button">顯示當前位置</button>
      <a class="action" id="uploadLink" href="Map-upload.html">+ 上載定位視頻</a>
      <a class="status-link" id="statusLink" href="Upload-status.html">查詢上傳狀態</a>
    </section>
    <div class="legend">
      <div id="legendSchool">🔵 學校地標</div>
      <div id="legendMuseum">🟡 博物館地標</div>
      <div id="legendVideo">🟣 用戶上傳影片</div>
      <div id="legendCurrent">🔷 當前位置</div>
    </div>

    <script src="config.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>

    resultWaiting: 'Fetching your current location...',

  pt: {

    pageTitle: 'Mapa Holográfico de Macau',
    pageSubtitle: 'Uma experiência de mapa holográfico de nova geração baseada na dispersão gaussiana e na navegação Beidou',
    resultWaiting: 'A obter a sua localização atual...',
    locateBtn: 'Mostrar localização atual',

    statusText: 'Estado do envio',

    legendMuseum: '🟡 Museu',
    legendVideo: '🟣 Vídeo enviado por utilizadores',
    legendCurrent: '🔷 Localização atual',
    success: 'Localização atual apresentada',
    noSupport: 'O seu navegador não suporta geolocalização',
    locateError: 'Não foi possível obter a localização: ',
    statusLabel: 'Coordenadas:',
    phoneLabel: 'Telefone:',
    moreInfo: 'Mais informações',
    likeAria: 'Curtir'
  }
};
const requestedLanguage = new URLSearchParams(location.search).get('lang');
const state = { lang: translations[requestedLanguage] ? requestedLanguage : 'zh-Hant' };
function t(k) { return translations[state.lang][k]; }
function applyLanguage() {
  document.body.classList.toggle('simplified-chinese-font', state.lang === 'zh-Hans');
  document.getElementById('languageLabel').textContent = t('languageLabel');
  document.getElementById('languageLabel').setAttribute('aria-expanded', 'false');
  document.querySelector('.language-control').classList.remove('open');
  document.getElementById('langToggle').setAttribute('aria-label', t('languageLabel'));
  document.getElementById('pageTitle').textContent = t('pageTitle');
  document.getElementById('pageSubtitle').textContent = t('pageSubtitle');
  document.getElementById('locateBtn').textContent = t('locateBtn');
  document.getElementById('uploadLink').textContent = t('uploadText');
  document.getElementById('statusLink').textContent = t('statusText');
  document.getElementById('statusLink').href = `Upload-status.html?lang=${state.lang}`;
  document.getElementById('legendSchool').textContent = t('legendSchool');
  document.getElementById('legendMuseum').textContent = t('legendMuseum');
  document.getElementById('legendVideo').textContent = t('legendVideo');
  document.getElementById('legendCurrent').textContent = t('legendCurrent');
  document.getElementById('langToggle').value = state.lang;
  const result = document.getElementById('result');
  if (result && !result.dataset.hasLocation) {
    result.textContent = t('resultWaiting');
  }

  document.querySelectorAll('.leaflet-popup .phone-label').forEach(el => {
    el.textContent = t('phoneLabel');
  });
  document.querySelectorAll('.leaflet-popup .more-info-link').forEach(el => {
    el.textContent = t('moreInfo');
  });
  document.querySelectorAll('.leaflet-popup .like-btn').forEach(btn => {
    btn.setAttribute('aria-label', t('likeAria'));
  });
}
document.getElementById('langToggle').addEventListener('change', (event) => {
  state.lang = event.target.value;
  applyLanguage();
  const result = document.getElementById('result');
  if (result && result.dataset.hasLocation) {
    const lat = Number(result.dataset.lat);
    const lng = Number(result.dataset.lng);
    const accuracy = Number(result.dataset.accuracy || 0);
    if (!Number.isNaN(lat) && !Number.isNaN(lng)) {
      result.innerHTML = `<b>${t('success')}</b><br>${t('statusLabel')} ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }
  }
});
document.getElementById('languageLabel').addEventListener('click', () => {
  const control = document.querySelector('.language-control');
  const isOpen = control.classList.toggle('open');
  document.getElementById('languageLabel').setAttribute('aria-expanded', String(isOpen));
});
const center=[22.186945,113.541765], map=L.map('container', { zoomControl: false }).setView(center,16);
L.control.zoom({ position: 'bottomleft' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
function icon(c){
  return L.divIcon({
    className:'',html:`<div class="pin" style="background:${c}"><i></i></div>`,iconSize:[28,36],iconAnchor:[14,34],popupAnchor:[0,-30]
  })
}
const icons={
  school:icon('#60a5fa'),museum:icon('#fbbf24'),video:icon('#a855f7')
};
function card(title,tag,image,address,phone,link,video,description){
  const likeKey = encodeURIComponent((title||'') + '|' + (tag||'') + '|' + (phone||''));
  const mediaHtml = video?`<video controls src="${video}"></video>`:image?`<img src="${image}" alt="${title}">`:'';
  const addressHtml = address?`<div class="info-row"><div>${address}</div></div>`:'';
  const phoneHtml = phone?`<div class="info-row"><div><span class="phone-label">${t('phoneLabel')}</span> <span class="phone">${phone}</span></div><button class="like-btn" data-like-key="${likeKey}" type="button" aria-label="${t('likeAria')}">👍 <span class="like-count">0</span></button></div>`:'';
  const descHtml = description?`<p>${description}</p>`:'';
  const linkHtml = link?`<p><a class="more-info-link" href="${link}" target="_blank" rel="noopener">${t('moreInfo')}</a></p>`:'';
  return `<div class="card"><h3>${title} <span class="tag">${tag}</span></h3><section>${mediaHtml}${addressHtml}${phoneHtml}${descHtml}${linkHtml}</section></div>`;
}
function add(lat,lng,content,type){
  return L.marker([lat,lng],{
    icon:icons[type]
  }).addTo(map).bindPopup(content)
}
add(22.1895567,113.5371289,card('澳門慈幼中學','學校','./assets/img/IS_School_Macau.png','澳門風順堂街十六號','(853) 2857 3033','http://ism.edu.mo'),'school');
add(22.186457, 113.556915,card('澳門科學館','博物館','./assets/img/MSC.jpg','澳門孫逸仙大馬路','(853) 2888 0822','https://www.msc.org.mo/zh'),'museum');
async function loadVideos(){
  try{
    const videos=await window.HoloMapAPI.fetchVideos();
    (videos||[]).forEach(v=>{
      if(v.lat==null||v.lng==null)return;
      add(Number(v.lat),Number(v.lng),card(v.title||'全息定位影片','影音地標',null,`經緯度: ${Number(v.lat).toFixed(4)}, ${Number(v.lng).toFixed(4)}`,null,null,v.video_url,v.description||''),'video');
    })
  }
  catch(e){
    console.error(e)
  }
}

function getLikeLocalKey(key){ return 'holomap:liked:' + key }
function getLikeCountLocalKey(key){ return 'holomap:likeCount:' + key }
function hasLiked(key){
  try { return localStorage.getItem(getLikeLocalKey(key)) === '1'; }
  catch (e) { return false; }
}
function setLiked(key){
  try { localStorage.setItem(getLikeLocalKey(key), '1'); }
  catch (e) {}
}
function getLocalLikeCount(key){
  try { return Number(localStorage.getItem(getLikeCountLocalKey(key)) || 0); }
  catch (e) { return 0; }
}
function setLocalLikeCount(key, value){
  try { localStorage.setItem(getLikeCountLocalKey(key), String(value)); }
  catch (e) {}
}

async function fetchLikeCount(key){
  const fallback = getLocalLikeCount(key);
  if (!window.HoloMapAPI || !window.HoloMapAPI.isCloudEnabled || !window.HoloMapAPI.isCloudEnabled()) {
    return fallback;
  }
  const supabase = window.HoloMapAPI.getClient();
  if (!supabase) return fallback;
  try {
    const { data, error } = await supabase.from('map_likes').select('count').eq('key', key).maybeSingle();
    if (error && error.code !== 'PGRST116') throw error;
    const count = Number((data && data.count) || fallback || 0);
    setLocalLikeCount(key, count);
    return count;
  } catch (e) {
    console.warn('fetchLikeCount failed:', e);
    return fallback;
  }
}

async function incrementLike(key){
  if (hasLiked(key)) {
    return fetchLikeCount(key);
  }

  const fallback = getLocalLikeCount(key);
  if (window.HoloMapAPI && window.HoloMapAPI.isCloudEnabled && window.HoloMapAPI.isCloudEnabled()) {
    const supabase = window.HoloMapAPI.getClient();
    if (supabase) {
      try {
        const { data: current, error: currentErr } = await supabase.from('map_likes').select('count').eq('key', key).maybeSingle();
        if (currentErr && currentErr.code !== 'PGRST116') throw currentErr;
        const next = Number((current && current.count) || fallback || 0) + 1;
        const { data, error } = await supabase.from('map_likes').upsert({ key, count: next }, { onConflict: 'key' }).select('count').single();
        if (!error && data) {
          const finalCount = Number(data.count || next);
          setLocalLikeCount(key, finalCount);
          setLiked(key);
          return finalCount;
        }
        if (error) throw error;
      } catch (e) {
        console.warn('incrementLike cloud failed:', e);
      }
    }
  }

  const next = fallback + 1;
  setLocalLikeCount(key, next);
  setLiked(key);
  return next;
}

map.on('popupopen', async function(e){
  const popupEl = e.popup.getElement();
  if (!popupEl) return;
  popupEl.querySelectorAll('.phone-label').forEach(el => {
    el.textContent = t('phoneLabel');
  });
  popupEl.querySelectorAll('.more-info-link').forEach(el => {
    el.textContent = t('moreInfo');
  });
  popupEl.querySelectorAll('.like-btn').forEach(async (btn) => {
    btn.setAttribute('aria-label', t('likeAria'));
    const key = btn.dataset.likeKey;
    const countSpan = btn.querySelector('.like-count');
    const currentCount = await fetchLikeCount(key);
    if (countSpan) countSpan.textContent = String(currentCount);
    if (hasLiked(key)) {
      btn.classList.add('liked');
      btn.disabled = true;
      return;
    }
    btn.onclick = async function (event) {
      event.preventDefault();
      if (hasLiked(key)) return;
      btn.disabled = true;
      const newCount = await incrementLike(key);
      if (countSpan) countSpan.textContent = String(newCount);
      btn.classList.add('liked');
    };
  });
});

let userMarker=null,userCircle=null;
function showLocation(lat,lng,accuracy){
  const pos=[lat,lng];
  if(!userMarker)userMarker=L.marker(pos,{
    icon:L.divIcon({
      className:'',html:'<div class="user-pin"></div>',iconSize:[24,24],iconAnchor:[12,12]
    })
  }).addTo(map).bindPopup('您的當前位置');
  else userMarker.setLatLng(pos);
  if(accuracy){
    if(!userCircle)userCircle=L.circle(pos,{
      radius:accuracy,color:'#2563eb',fillColor:'#2563eb',fillOpacity:.12,weight:1
    }).addTo(map);
    else userCircle.setLatLng(pos).setRadius(accuracy)
  }
  map.setView(pos,17);
  const result=document.getElementById('result');
  result.dataset.hasLocation='1';
  result.dataset.lat=String(lat);
  result.dataset.lng=String(lng);
  result.dataset.accuracy=String(accuracy||0);
  result.innerHTML=`<b>${t('success')}</b><br>${t('statusLabel')} ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  document.getElementById('uploadLink').href=`Map-upload.html?lat=${lat}&lng=${lng}`;
  userMarker.openPopup()
}
function locate(){
  const result=document.getElementById('result');
  result.dataset.hasLocation='';
  result.textContent=t('resultWaiting');
  if(!navigator.geolocation){
    result.textContent=t('noSupport');
    return
  }
  navigator.geolocation.getCurrentPosition(p=>showLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>{
    result.textContent=t('locateError')+e.message
  },{
    enableHighAccuracy:true,timeout:15000,maximumAge:0
  })
}
document.getElementById('locateBtn').onclick=locate;
applyLanguage();
locate();
loadVideos();
    </script>
