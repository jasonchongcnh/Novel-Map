<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>澳門全息地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
html,body,#container{height:100%;width:100%;margin:0}body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#0f172a;overflow:hidden}#container{background:#e2e8f0}.panel,.legend{position:absolute;z-index:1000;background:rgba(255,255,255,.95);border:1px solid #cbd5e1;border-radius:16px;box-shadow:0 12px 32px #64748b33;padding:20px}.panel{top:24px;left:24px;width:360px}.legend{top:24px;right:24px}.panel h1{margin:0 0 8px;font-size:26px}.panel p{color:#475569;line-height:1.5}.location{padding:12px;background:#f1f5f9;border-radius:10px;line-height:1.7}.action{display:block;text-align:center;margin-top:14px;padding:10px;border-radius:8px;background:#0ea5e9;color:#fff;text-decoration:none}.locate{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:#334155;color:#fff;cursor:pointer}.lang-toggle{position:absolute;right:24px;top:104px;z-index:1001;padding:8px 12px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;color:#0f172a;cursor:pointer;box-shadow:0 8px 24px #64748b22}.legend div{margin:6px}.pin{width:24px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px #0006}.pin i{display:block;width:8px;height:8px;margin:6px;background:#020617;border-radius:50%}.user-pin{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 5px #2563eb55,0 2px 6px #0008}.leaflet-popup-content{margin:0}.card{width:300px;overflow:hidden}.card h3{margin:0;padding:12px 16px;border-bottom:1px solid #e2e8f0}.card section{padding:12px 16px;color:#475569}.card img,.card video{max-width:100%;max-height:180px;border-radius:8px}.tag{font-size:11px;color:#0284c7}@media(max-width:600px){.panel{left:12px;right:12px;bottom:12px;top:auto;width:auto}.legend{top:12px;right:12px;padding:10px;font-size:12px}.lang-toggle{top:auto;bottom:120px;right:12px}}</style></head>
<body><div id="container"></div><button class="lang-toggle" id="langToggle" type="button">繁體 / 简体</button><section class="panel"><h1 id="pageTitle">澳門全息地圖</h1><p id="pageSubtitle">基於高斯濺射與北斗衛星導航系統的新型全息地圖體驗</p><div class="location" id="result">正在獲取您的當前位置...</div><button class="locate" id="locateBtn" type="button">顯示當前位置</button><a class="action" id="uploadLink" href="Map-upload.html">+ 上載定位視頻</a></section><div class="legend"><div id="legendSchool">🔵 學校地標</div><div id="legendMuseum">🟡 博物館地標</div><div id="legendVideo">🟣 用戶上傳影片</div><div id="legendCurrent">🔷 當前位置</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const translations = {
  'zh-Hant': {
    pageTitle: '澳門全息地圖',
    pageSubtitle: '基於高斯濺射與北斗衛星導航系統的新型全息地圖體驗',
    resultWaiting: '正在獲取您的當前位置...',
    locateBtn: '顯示當前位置',
    uploadText: '+ 上載定位視頻',
    legendSchool: '🔵 學校地標',
    legendMuseum: '🟡 博物館地標',
    legendVideo: '🟣 用戶上傳影片',
    legendCurrent: '🔷 當前位置',
    success: '已顯示當前位置',
    noSupport: '您的瀏覽器不支援地理定位',
    locateError: '無法獲取位置信息: ',
    statusLabel: 'coords:'
  },
  'zh-Hans': {
    pageTitle: '澳门全息地图',
    pageSubtitle: '基于高斯散射与北斗卫星导航系统的新型全息地图体验',
    resultWaiting: '正在获取您当前的位置...',
    locateBtn: '显示当前位置',
    uploadText: '+ 上传定位视频',
    legendSchool: '🔵 学校地标',
    legendMuseum: '🟡 博物馆地标',
    legendVideo: '🟣 用户上传影片',
    legendCurrent: '🔷 当前位置',
    success: '已显示当前位置',
    noSupport: '您的浏览器不支持地理定位',
    locateError: '无法获取位置信息: ',
    statusLabel: 'coords:'
  }
};
const state = { lang: 'zh-Hant' };
function t(key) { return translations[state.lang][key]; }
function applyLanguage() {
  document.getElementById('pageTitle').textContent = t('pageTitle');
  document.getElementById('pageSubtitle').textContent = t('pageSubtitle');
  document.getElementById('locateBtn').textContent = t('locateBtn');
  document.getElementById('uploadLink').textContent = t('uploadText');
  document.getElementById('legendSchool').textContent = t('legendSchool');
  document.getElementById('legendMuseum').textContent = t('legendMuseum');
  document.getElementById('legendVideo').textContent = t('legendVideo');
  document.getElementById('legendCurrent').textContent = t('legendCurrent');
  document.getElementById('langToggle').textContent = state.lang === 'zh-Hant' ? '繁體 / 简体' : '简体 / 繁體';
  const result = document.getElementById('result');
  if (result && !result.dataset.hasLocation) {
    result.textContent = t('resultWaiting');
  }
}
document.getElementById('langToggle').addEventListener('click', () => {
  state.lang = state.lang === 'zh-Hant' ? 'zh-Hans' : 'zh-Hant';
  applyLanguage();
  const result = document.getElementById('result');
  if (result && result.dataset.hasLocation) {
    const lat = Number(result.dataset.lat);
    const lng = Number(result.dataset.lng);
    const accuracy = Number(result.dataset.accuracy || 0);
    if (!Number.isNaN(lat) && !Number.isNaN(lng)) {
      result.innerHTML = `<b>${t('success')}</b><br>${t('statusLabel')} ${lat.toFixed(6)}, ${lng.toFixed(6)}${accuracy ? '，精度約 ' + Math.round(accuracy) + 'm' : ''}`;
    }
  }
});
const center=[22.186945,113.541765], map=L.map('container').setView(center,16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);function icon(color){return L.divIcon({className:'',html:`<div class="pin" style="background:${color}"><i></i></div>`,iconSize:[28,36],iconAnchor:[14,34],popupAnchor:[0,-30]})}const icons={school:icon('#60a5fa'),museum:icon('#fbbf24'),video:icon('#a855f7')};function card(title,tag,image,address,phone,link,video,description){return `<div class="card"><h3>${title} <span class="tag">${tag}</span></h3><section>${video?`<video controls src="${video}"></video>`:image?`<img src="${image}" alt="${title}">`:''}${description?`<p>${description}</p>`:''}${address?`<p>📍 ${address}</p>`:''}${phone?`<p>☎ ${phone}</p>`:''}${link?`<a href="${link}" target="_blank">更多資訊 →</a>`:''}</section></div>`}function add(lat,lng,content,type){return L.marker([lat,lng],{icon:icons[type]}).addTo(map).bindPopup(content)}add(22.186945,113.541765,card('澳門慈幼中學','學校','./assets/img/IS_School_Macau.png','澳門風順堂街十六號','(853) 2857 3033','http://ism.edu.mo'),'school');add(22.18336,113.562085,card('澳門科學館','博物館','./assets/img/MSC.jpg','澳門孫逸仙大馬路','(853) 2888 0822','https://www.msc.org.mo/zh'),'museum');async function loadVideos(){try{const videos=await window.HoloMapAPI.fetchVideos();(videos||[]).forEach(v=>{if(v.lat==null||v.lng==null)return;add(Number(v.lat),Number(v.lng),card(v.title||'全息定位影片','影音地標',null,`經緯度: ${Number(v.lat).toFixed(4)}, ${Number(v.lng).toFixed(4)}`,null,null,v.video_url,v.description||''),'video')})}catch(e){console.error(e)}}let userMarker=null,userCircle=null;function showLocation(lat,lng,accuracy){const pos=[lat,lng];if(!userMarker){userMarker=L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="user-pin"></div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map).bindPopup('您的當前位置')}else userMarker.setLatLng(pos);if(accuracy){if(!userCircle)userCircle=L.circle(pos,{radius:accuracy,color:'#2563eb',fillColor:'#2563eb',fillOpacity:.12,weight:1}).addTo(map);else userCircle.setLatLng(pos).setRadius(accuracy)}map.setView(pos,17);const result=document.getElementById('result');result.dataset.hasLocation='1';result.dataset.lat=String(lat);result.dataset.lng=String(lng);result.dataset.accuracy=String(accuracy||0);result.innerHTML=`<b>${t('success')}</b><br>${t('statusLabel')} ${lat.toFixed(6)}, ${lng.toFixed(6)}${accuracy?'，精度約 '+Math.round(accuracy)+'m':''}`;document.getElementById('uploadLink').href=`Map-upload.html?lat=${lat}&lng=${lng}`;userMarker.openPopup()}function locate(){const result=document.getElementById('result');result.dataset.hasLocation='';result.textContent=t('resultWaiting');if(!navigator.geolocation){result.textContent=t('noSupport');return}navigator.geolocation.getCurrentPosition(p=>showLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>{result.textContent=t('locateError')+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}document.getElementById('locateBtn').onclick=locate;applyLanguage();locate();loadVideos();</script></body></html>
