<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>澳門全息地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
html,body,#container{height:100%;width:100%;margin:0}body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#0f172a;overflow:hidden}#container{background:#e2e8f0}.panel,.legend{position:absolute;z-index:1000;background:rgba(255,255,255,.95);border:1px solid #cbd5e1;border-radius:16px;box-shadow:0 12px 32px #64748b33;padding:20px}.panel{top:24px;left:24px;width:360px}.legend{top:24px;right:24px}.panel h1{margin:0 0 8px;font-size:26px}.panel p{color:#475569;line-height:1.5}.location{padding:12px;background:#f1f5f9;border-radius:10px;line-height:1.7}.action{display:block;text-align:center;margin-top:14px;padding:10px;border-radius:8px;background:#0ea5e9;color:#fff;text-decoration:none}.legend div{margin:6px}.pin{width:24px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px #0006}.pin i{display:block;width:8px;height:8px;margin:6px;background:#020617;border-radius:50%}.leaflet-popup-content{margin:0}.card{width:300px;overflow:hidden}.card h3{margin:0;padding:12px 16px;border-bottom:1px solid #e2e8f0}.card section{padding:12px 16px;color:#475569}.card img,.card video{max-width:100%;max-height:180px;border-radius:8px}.tag{font-size:11px;color:#0284c7}
@media(max-width:600px){.panel{left:12px;right:12px;bottom:12px;top:auto;width:auto}.legend{top:12px;right:12px;padding:10px;font-size:12px}}
</style></head>
<body><div id="container"></div><section class="panel"><h1>澳門全息地圖</h1><p>基於高斯濺射與北斗衛星導航系統的新型全息地圖體驗</p><div class="location" id="result">正在嘗試獲取您的位置信息...</div><a class="action" id="uploadLink" href="Map-upload.html">+ 上載定位視頻</a></section><div class="legend"><div>🔵 學校地標</div><div>🟡 博物館地標</div><div>🟣 用戶上傳影片</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const center=[22.186945,113.541765], map=L.map('container').setView(center,16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
function icon(color){return L.divIcon({className:'',html:`<div class="pin" style="background:${color}"><i></i></div>`,iconSize:[28,36],iconAnchor:[14,34],popupAnchor:[0,-30]})}
const icons={school:icon('#60a5fa'),museum:icon('#fbbf24'),video:icon('#a855f7')};
function card(title,tag,image,address,phone,link,video,description){return `<div class="card"><h3>${title} <span class="tag">${tag}</span></h3><section>${video?`<video controls src="${video}"></video>`:image?`<img src="${image}" alt="${title}">`:''}${description?`<p>${description}</p>`:''}${address?`<p>📍 ${address}</p>`:''}${phone?`<p>☎ ${phone}</p>`:''}${link?`<a href="${link}" target="_blank">更多資訊 →</a>`:''}</section></div>`}
function add(lat,lng,content,type){return L.marker([lat,lng],{icon:icons[type]}).addTo(map).bindPopup(content)}
add(22.186945,113.541765,card('澳門慈幼中學','學校','./assets/img/IS_School_Macau.png','澳門風順堂街十六號','(853) 2857 3033','http://ism.edu.mo'), 'school');add(22.18336,113.562085,card('澳門科學館','博物館','./assets/img/MSC.jpg','澳門孫逸仙大馬路','(853) 2888 0822','https://www.msc.org.mo/zh'),'museum');
async function loadVideos(){try{const videos=await window.HoloMapAPI.fetchVideos();(videos||[]).forEach(v=>{if(v.lat==null||v.lng==null)return;add(Number(v.lat),Number(v.lng),card(v.title||'全息定位影片','影音地標',null,`經緯度: ${Number(v.lat).toFixed(4)}, ${Number(v.lng).toFixed(4)}`,null,null,v.video_url,v.description||''),'video')})}catch(e){console.error('Failed to load uploaded map videos:',e)}}
function show(lat,lng,accuracy){document.getElementById('result').innerHTML=`<b>定位成功</b><br>coords: ${lat.toFixed(6)}, ${lng.toFixed(6)}${accuracy?'，精度約 '+Math.round(accuracy)+'m':''}`;document.getElementById('uploadLink').href=`Map-upload.html?lat=${lat}&lng=${lng}`;map.setView([lat,lng],17)}
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>show(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>document.getElementById('result').textContent='無法獲取位置信息: '+e.message,{enableHighAccuracy:true,timeout:15000,maximumAge:0});else document.getElementById('result').textContent='您的瀏覽器不支援地理定位';loadVideos();
</script></body></html>
