<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>澳門全息地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
    html,body,#container{
      height:100%;
      width:100%;
      margin:0
    }
    body{
      font-family:Inter,"Noto Sans CJK TC",sans-serif;
      color:#0f172a;
      overflow:hidden
    }
    body.simplified-chinese-font,
    body.simplified-chinese-font *{
      font-family:Inter,"Microsoft YaHei",sans-serif
    }
    #container{
      background:#e2e8f0
    }
    .panel,.legend{
      position:absolute;
      z-index:1000;
      background:rgba(255,255,255,.95);
      border:1px solid #cbd5e1;
      border-radius:16px;
      box-shadow:0 12px 32px #64748b33;
      padding:20px
    }
    .panel{
      top:24px;
      left:24px;
      width:360px;
      max-height:calc(100svh - 88px);
      overflow-y:auto
    }
    .legend{
      top:24px;
      right:24px
    }
    .panel h1{
      margin:0 0 8px 36px;
      font-size:26px
    }
    .panel p{
      color:#475569;
      line-height:1.5
    }
    .location{
      padding:12px;
      background:#f1f5f9;
      border-radius:10px;
      line-height:1.7
    }
    .action{
      display:block;
      text-align:center;
      margin-top:14px;
      padding:10px;
      border-radius:8px;
      background:#0ea5e9;
      color:#fff;
      text-decoration:none
    }
    .locate{
      margin-top:10px;
      width:100%;
      padding:10px;
      border:0;
      border-radius:8px;
      background:#334155;
      color:#fff;
      cursor:pointer
    }
    .status-link{
      display:block;
      margin-top:8px;
      padding:10px;
      text-align:center;
      color:#0284c7;
      line-height:1.5
    }
    .lang-toggle{
      display:none;
      padding:8px 12px;
      border:1px solid #cbd5e1;
      border-radius:999px;
      background:#fff;
      color:#0f172a;
      cursor:pointer;
      box-shadow:0 8px 24px #64748b22;
      font-family:inherit
    }
    .language-control.open .lang-toggle{
      display:block
    }
    .language-label{
      padding:8px 12px;
      border:1px solid #cbd5e1;
      border-radius:999px;
      background:#fff;
      color:#0f172a;
      cursor:pointer;
      box-shadow:0 8px 24px #64748b22;
      font:inherit;
      font-weight:600
    }
    .language-control{
      position:absolute;
      right:24px;
      top:175px;
      z-index:1001;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px
    }
    .language-label{
      color:#0f172a;
      font-size:16px;
      font-weight:600
    }
    .legend div{
      margin:6px
    }
    .pin{
      width:24px;
      height:32px;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid #fff;
      box-shadow:0 2px 5px #0006
    }
    .pin i{
      display:block;
      width:8px;
      height:8px;
      margin:6px;
      background:#020617;
      border-radius:50%
    }
    .user-pin{
      width:18px;
      height:18px;
      border-radius:50%;
      background:#2563eb;
      border:3px solid #fff;
      box-shadow:0 0 0 5px #2563eb55,0 2px 6px #0008
    }
    .leaflet-popup-content{
      margin:0
    }
    .card{
      width:300px;
      overflow:hidden
    }
    .card h3{
      margin:0;
      padding:12px 16px;
      border-bottom:1px solid #e2e8f0
    }
    .card section{
      padding:12px 16px;
      color:#475569
    }
    .card img,.card video{
      max-width:100%;
      max-height:180px;
      border-radius:8px
    }
    .tag{
      font-size:11px;
      color:#0284c7
    }
    .info-row{display:flex;align-items:center;gap:8px;margin-top:8px}
    .phone{font-weight:600;color:#0f172a}
    .like-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:14px}
    .like-btn.liked{background:#ffe4e6;border-color:#fda4af}
    .like-btn:disabled{opacity:.75;cursor:default}
    .like-count{font-weight:600}
    .landmark-dialog{
      width:min(440px,calc(100vw - 40px));
      max-height:calc(100svh - 40px);
      box-sizing:border-box;
      overflow-y:auto;
      padding:20px;
      border:1px solid #cbd5e1;
      border-radius:16px;
      color:#0f172a;
      box-shadow:0 12px 32px #64748b55
    }
    .landmark-dialog::backdrop{background:#0f172a88}
    .landmark-dialog h2{margin:0 0 12px}
    .landmark-dialog label{display:block;margin-top:10px;font-weight:600}
    .landmark-dialog input,.landmark-dialog textarea{
      width:100%;
      box-sizing:border-box;
      margin-top:4px;
      padding:10px;
      border:1px solid #cbd5e1;
      border-radius:8px;
      font:inherit
    }
    .landmark-dialog textarea{min-height:80px;resize:vertical}
    .landmark-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    .landmark-dialog-actions button{padding:9px 14px;border:0;border-radius:8px;cursor:pointer}
    .landmark-submit{background:#0ea5e9;color:#fff}
    .landmark-cancel{background:#e2e8f0;color:#0f172a}
    .landmark-placement{color:#0369a1;font-size:14px}
    @media(max-width:600px){
      .panel{
        left:12px;
        right:12px;
        bottom:12px;
        top:auto;
        width:auto;
        max-height:calc(100svh - 64px)
      }
      .legend{
        top:12px;
        right:12px;
        padding:10px;
        font-size:12px
      }
      .leaflet-control-zoom{
        position:absolute;
        top:12px;
        left:12px
      }
      .language-control{
        top:100px;
        left:12px;
        right:auto;
        align-items:flex-start
      }
    }
    </style>

  <body>
    <div id="container"></div>
    <div class="language-control">
      <button class="language-label" id="languageLabel" type="button" aria-expanded="false">語言</button>
      <select class="lang-toggle" id="langToggle" aria-label="語言">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </div>
    <section class="panel">
      <h1 id="pageTitle">澳門全息地圖</h1>
      <p id="pageSubtitle">基於高斯濺射與北斗衛星導航系統的新型全息地圖體驗</p>
      <div class="location" id="result">正在獲取您的當前位置...</div>
      <button class="locate" id="locateBtn" type="button">顯示當前位置</button>
      <a class="action" id="uploadLink" href="Map-upload.html">+ 上載定位視頻</a>
      <button class="action locate" id="addLandmarkBtn" type="button">+ 新增地標</button>
      <p class="landmark-placement" id="landmarkPlacementStatus" hidden></p>
      <a class="status-link" id="statusLink" href="Upload-status.html">查詢上傳狀態</a>
    </section>
    <dialog class="landmark-dialog" id="landmarkDialog" aria-labelledby="landmarkFormTitle">
      <form id="landmarkForm">
        <h2 id="landmarkFormTitle">新增地標資訊</h2>
        <p id="landmarkLocationText"></p>
        <label for="landmarkTitle" id="landmarkTitleLabel">名稱</label>
        <input id="landmarkTitle" name="title" maxlength="100" required>
        <label for="landmarkTag" id="landmarkTagLabel">標籤</label>
        <input id="landmarkTag" name="tag" maxlength="40" required>
        <label for="landmarkAddress" id="landmarkAddressLabel">地址</label>
        <input id="landmarkAddress" name="address" maxlength="200">
        <label for="landmarkPhone" id="landmarkPhoneLabel">電話</label>
        <input id="landmarkPhone" name="phone" maxlength="40" type="tel">
        <label for="landmarkImage" id="landmarkImageLabel">圖片網址</label>
        <input id="landmarkImage" name="image_url" maxlength="2048" type="url">
        <label for="landmarkLink" id="landmarkLinkLabel">網站</label>
        <input id="landmarkLink" name="link" maxlength="2048" type="url">
        <label for="landmarkDescription" id="landmarkDescriptionLabel">描述</label>
        <textarea id="landmarkDescription" name="description" maxlength="1000"></textarea>
        <p class="landmark-placement" id="landmarkFormStatus" role="status"></p>
        <div class="landmark-dialog-actions">
          <button class="landmark-cancel" id="landmarkCancel" type="button">取消</button>
          <button class="landmark-submit" id="landmarkSubmit" type="submit">提交審核</button>
        </div>
      </form>
    </dialog>
    <div class="legend">
      <div id="legendSchool">🔵 學校地標</div>
      <div id="legendMuseum">🟡 博物館地標</div>
      <div id="legendVideo">🟣 用戶上傳影片</div>
      <div id="legendCurrent">🔷 當前位置</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=map-landmarks-1"></script>

const requestedLanguage = new URLSearchParams(location.search).get('lang');
const state = {
  lang: translations[requestedLanguage] ? requestedLanguage : 'zh-Hant',
  addingLandmark: false,
  selectedLandmarkLocation: null
};
const placeTitleTranslations = {
  '澳門慈幼中學': { 'zh-Hant': '澳門慈幼中學', 'zh-Hans': '澳门慈幼中学', en: 'Macau Immaculate Conception College', pt: 'Colégio Imaculado Coração de Maria' },
  '澳門科學館': { 'zh-Hant': '澳門科學館', 'zh-Hans': '澳门科学馆', en: 'Macau Science Center', pt: 'Centro de Ciência de Macau' },
  '學校': { 'zh-Hant': '學校', 'zh-Hans': '学校', en: 'School', pt: 'Escola' },
  '博物館': { 'zh-Hant': '博物館', 'zh-Hans': '博物馆', en: 'Museum', pt: 'Museu' }
};
function t(k) { return translations[state.lang][k]; }
const placeText = {
  'zh-Hant': {
    school: { title: '澳門慈幼中學', address: '澳門風順堂街十六號', tag: '學校', description: '澳門慈幼中學' },
    museum: { title: '澳門科學館', address: '澳門孫逸仙大馬路', tag: '博物館', description: '澳門科學館' },
    video: { title: '全息定位影片', tag: '影音地標', description: '全息定位影片' }
  },
  'zh-Hans': {
    school: { title: '澳门慈幼中学', address: '澳门风顺堂街十六号', tag: '学校', description: '澳门慈幼中学' },
    museum: { title: '澳门科学馆', address: '澳门孙逸仙大马路', tag: '博物馆', description: '澳门科学馆' },
    video: { title: '全息定位影片', tag: '影音地标', description: '全息定位影片' }
  },
  en: {
    school: { title: 'Macau School', address: '16 Rua do Campo, Macau', tag: 'School', description: 'School landmark' },
    museum: { title: 'Macau Museum', address: 'Avenida Sun Yat Sen, Macau', tag: 'Museum', description: 'Museum landmark' },
    video: { title: 'Holographic Location Video', tag: 'Video landmark', description: 'Holographic location video' }
  },
  pt: {
    school: { title: 'Escola de Macau', address: 'Rua do Campo n.º 16, Macau', tag: 'Escola', description: 'Ponto de referência escolar' },
    museum: { title: 'Museu de Macau', address: 'Avenida Sun Yat Sen, Macau', tag: 'Museu', description: 'Ponto de referência do museu' },
    video: { title: 'Vídeo de localização holográfica', tag: 'Marcador de vídeo', description: 'Vídeo de localização holográfica' }
  }
};
function tagLabel(key){
  if(!key) return '';
  const map = { school: 'tagSchool', museum: 'tagMuseum', video: 'tagVideo' };
  const tk = map[key] || key;
  return translations[state.lang] && translations[state.lang][tk] ? translations[state.lang][tk] : key;
}
function getPlaceMeta(type){
  const source = placeText[state.lang] && placeText[state.lang][type] ? placeText[state.lang][type] : placeText['zh-Hant'][type];
  if (!source) return { title: '', address: '', tag: '', description: '' };
  const canonical = placeText['zh-Hant'][type];
  const titleTranslation = canonical && placeTitleTranslations[canonical.title];
  const tagTranslation = canonical && placeTitleTranslations[canonical.tag];
  return {
    ...source,
    title: titleTranslation ? titleTranslation[state.lang] : source.title,
    tag: tagTranslation ? tagTranslation[state.lang] : source.tag
  };
}
function buildCardHtml(meta){
  const escapeHtml = value => String(value || '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[character]));
  const title = escapeHtml(meta.title);
  const tag = escapeHtml(meta.tag);
  const image = escapeHtml(meta.image);
  const address = escapeHtml(meta.address);
  const phone = escapeHtml(meta.phone);
  const video = escapeHtml(meta.video);
  const description = escapeHtml(meta.description);
  const rawLink = String(meta.link || '');
  const link = /^https?:\/\/\S+$/i.test(rawLink) ? escapeHtml(rawLink) : '';
  const tagKey = ['school', 'museum', 'video'].includes(meta.type) ? meta.type : '';
  const mediaHtml = video ? `<video controls src="${video}"></video>` : image ? `<img src="${image}" alt="${title}">` : '';
  const addressHtml = address ? `<div class="info-row"><div>${address}</div></div>` : '';
  const phoneHtml = phone ? `<div class="info-row"><div><span class="phone-label">${t('phoneLabel')}</span> <span class="phone">${phone}</span></div>${meta.likeKey ? `<button class="like-btn" data-like-key="${escapeHtml(meta.likeKey)}" type="button" aria-label="${t('likeAria')}">👍 <span class="like-count">${meta.likeCount || 0}</span></button>` : ''}</div>` : '';
  const descHtml = description ? `<p>${description}</p>` : '';
  const linkHtml = link ? `<p><a class="more-info-link" href="${link}" target="_blank" rel="noopener">${t('moreInfo')}</a></p>` : '';
  return `<div class="card"><h3>${title} <span class="tag" data-tag-key="${tagKey}">${tag}</span></h3><section>${mediaHtml}${addressHtml}${phoneHtml}${descHtml}${linkHtml}</section></div>`;
}
function applyLanguage() {
  document.body.classList.toggle('simplified-chinese-font', state.lang === 'zh-Hans');
  document.getElementById('languageLabel').textContent = t('languageLabel');
  document.getElementById('languageLabel').setAttribute('aria-expanded', 'false');
  document.querySelector('.language-control').classList.remove('open');
  document.getElementById('langToggle').setAttribute('aria-label', t('languageLabel'));
  document.getElementById('pageTitle').textContent = t('pageTitle');
  document.getElementById('pageSubtitle').textContent = t('pageSubtitle');
  document.getElementById('locateBtn').textContent = t('locateBtn');
  document.getElementById('uploadLink').textContent = t('uploadText');
  document.getElementById('statusLink').textContent = t('statusText');
  document.getElementById('statusLink').href = `Upload-status.html?lang=${state.lang}`;
  document.getElementById('legendSchool').textContent = t('legendSchool');
  document.getElementById('legendMuseum').textContent = t('legendMuseum');
  document.getElementById('legendVideo').textContent = t('legendVideo');
  document.getElementById('legendCurrent').textContent = t('legendCurrent');
  document.getElementById('langToggle').value = state.lang;
  document.getElementById('addLandmarkBtn').textContent = t('addLandmark');
  document.getElementById('landmarkFormTitle').textContent = t('landmarkFormTitle');

    const translated = key ? tagLabel(key) : el.textContent;
    if (translated) el.textContent = translated;
  });

function getLikeLocalKey(key){ return 'holomap:liked:' + key }
function getLikeCountLocalKey(key){ return 'holomap:likeCount:' + key }
function hasLiked(key){
  try { return localStorage.getItem(getLikeLocalKey(key)) === '1'; }
  catch (e) { return false; }
}
function setLiked(key){
  try { localStorage.setItem(getLikeLocalKey(key), '1'); }
  catch (e) {}
}
function getLocalLikeCount(key){
  try { return Number(localStorage.getItem(getLikeCountLocalKey(key)) || 0); }
  catch (e) { return 0; }
}
function setLocalLikeCount(key, value){
  try { localStorage.setItem(getLikeCountLocalKey(key), String(value)); }
  catch (e) {}
}

async function fetchLikeCount(key){
  const fallback = getLocalLikeCount(key);
  if (!window.HoloMapAPI || !window.HoloMapAPI.isCloudEnabled || !window.HoloMapAPI.isCloudEnabled()) {
    return fallback;
  }
  const supabase = window.HoloMapAPI.getClient();
  if (!supabase) return fallback;
  try {
    const { data, error } = await supabase.from('map_likes').select('count').eq('key', key).maybeSingle();
    if (error && error.code !== 'PGRST116') throw error;
    const count = Number((data && data.count) || fallback || 0);
    setLocalLikeCount(key, count);
    return count;
  } catch (e) {
    console.warn('fetchLikeCount failed:', e);
    return fallback;
  }
}

async function incrementLike(key){
  if (hasLiked(key)) {
    return fetchLikeCount(key);
  }

  const fallback = getLocalLikeCount(key);
  if (window.HoloMapAPI && window.HoloMapAPI.isCloudEnabled && window.HoloMapAPI.isCloudEnabled()) {
    const supabase = window.HoloMapAPI.getClient();
    if (supabase) {
      try {
        const { data: current, error: currentErr } = await supabase.from('map_likes').select('count').eq('key', key).maybeSingle();
        if (currentErr && currentErr.code !== 'PGRST116') throw currentErr;
        const next = Number((current && current.count) || fallback || 0) + 1;
        const { data, error } = await supabase.from('map_likes').upsert({ key, count: next }, { onConflict: 'key' }).select('count').single();
        if (!error && data) {
          const finalCount = Number(data.count || next);
          setLocalLikeCount(key, finalCount);
          setLiked(key);
          return finalCount;
        }
        if (error) throw error;
      } catch (e) {
        console.warn('incrementLike cloud failed:', e);
      }
    }
  }

  const next = fallback + 1;
  setLocalLikeCount(key, next);
  setLiked(key);
  return next;
}

map.on('popupopen', async function(e){
  const popupEl = e.popup.getElement();
  if (!popupEl) return;
  popupEl.querySelectorAll('.phone-label').forEach(el => {
    el.textContent = t('phoneLabel');
  });
  popupEl.querySelectorAll('.more-info-link').forEach(el => {
    el.textContent = t('moreInfo');
  });
  popupEl.querySelectorAll('.tag').forEach(el => {
    const key = el.dataset.tagKey;
    if (key) el.textContent = tagLabel(key);
  });
  popupEl.querySelectorAll('.like-btn').forEach(async (btn) => {
    btn.setAttribute('aria-label', t('likeAria'));
    const key = btn.dataset.likeKey;
    const countSpan = btn.querySelector('.like-count');
    const currentCount = await fetchLikeCount(key);
    if (countSpan) countSpan.textContent = String(currentCount);
    if (hasLiked(key)) {
      btn.classList.add('liked');
      btn.disabled = true;
      return;
    }
    btn.onclick = async function (event) {
      event.preventDefault();
      if (hasLiked(key)) return;
      btn.disabled = true;
      const newCount = await incrementLike(key);
      if (countSpan) countSpan.textContent = String(newCount);
      btn.classList.add('liked');
    };
  });
});

let userMarker=null,userCircle=null;
function showLocation(lat,lng,accuracy){
  const pos=[lat,lng];
  if(!userMarker)userMarker=L.marker(pos,{
    icon:L.divIcon({
      className:'',html:'<div class="user-pin"></div>',iconSize:[24,24],iconAnchor:[12,12]
    })
  }).addTo(map).bindPopup('您的當前位置');
  else userMarker.setLatLng(pos);
  if(accuracy){
    if(!userCircle)userCircle=L.circle(pos,{
      radius:accuracy,color:'#2563eb',fillColor:'#2563eb',fillOpacity:.12,weight:1
    }).addTo(map);
    else userCircle.setLatLng(pos).setRadius(accuracy)
  }
  map.setView(pos,17);
  const result=document.getElementById('result');
  result.dataset.hasLocation='1';
  result.dataset.lat=String(lat);
  result.dataset.lng=String(lng);
  result.dataset.accuracy=String(accuracy||0);
  result.innerHTML=`<b>${t('success')}</b><br>${t('statusLabel')} ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  document.getElementById('uploadLink').href=`Map-upload.html?lat=${lat}&lng=${lng}`;
  userMarker.openPopup()
}
function locate(){
  const result=document.getElementById('result');
  result.dataset.hasLocation='';
  result.textContent=t('resultWaiting');
  if(!navigator.geolocation){
    result.textContent=t('noSupport');
    return
  }
  navigator.geolocation.getCurrentPosition(p=>showLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>{
    result.textContent=t('locateError')+e.message
  },{
    enableHighAccuracy:true,timeout:15000,maximumAge:0
  })
}
document.getElementById('locateBtn').onclick=locate;
