<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>上載影片</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;margin:0;padding:24px;color:#0f172a}
    .box{max-width:560px;margin:auto;background:#fff;padding:28px;border:1px solid #cbd5e1;border-radius:20px;box-shadow:0 12px 32px #64748b33;position:relative}
    .lang-toggle{position:absolute;top:18px;right:18px;padding:8px 12px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;cursor:pointer;font-family:inherit}
    .box h1,.box>p{padding-right:110px}
    h1{margin-top:0}
    label{display:block;margin:18px 0 6px;font-weight:700;color:#475569}
    input,button{font:inherit}
    input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
    .loc{display:flex;gap:8px;align-items:center;padding:12px;background:#f1f5f9;border-radius:10px}
    .loc span{flex:1;color:#475569}
    button{padding:10px 14px;border:0;border-radius:8px;background:#0ea5e9;color:#fff;cursor:pointer}
    button:disabled{opacity:.5}
    .submit{width:100%;margin-top:22px;font-weight:700}
    .back{display:block;text-align:center;margin-top:18px;color:#0284c7}
    .modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center}
    .modal.open{display:flex}
    .mapbox{width:90%;max-width:800px;height:75vh;background:#fff;border-radius:14px;overflow:hidden}
    .map{height:calc(100% - 56px)}
    .maphead{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;box-sizing:border-box}
    .user-pin{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 5px #2563eb55,0 2px 6px #0008}
    [hidden]{display:none!important}
    .receipt{margin-top:24px;border-top:1px solid #cbd5e1;padding-top:20px}
    .receipt h2{font-size:20px;margin:0 0 12px;color:#15803d}
    .receipt textarea{font:14px/1.5 monospace;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;resize:none}
    .receipt-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
    .receipt-actions a{color:#0284c7}
    .receipt-actions button{display:inline-flex;align-items:center;gap:6px}
    .receipt-actions svg{width:18px;height:18px}
    .receipt p{line-height:1.5;color:#475569}
    #copyMessage{min-height:24px}
    @media(max-width:600px){
      body{padding:12px}
      .box{padding:20px}
      .box h1,.box>p{padding-right:0}
      .lang-toggle{position:static;display:block;margin:0 0 18px auto;min-height:44px}
      .loc{flex-wrap:wrap}
      .loc span{flex-basis:100%}
      .loc button{flex:1;min-height:44px}
    }
  </style>
</head>
<body>
  <main class="box">
    <select id="langSelect" class="lang-toggle" aria-label="Language">
      <option value="zh-Hant">繁體</option>
      <option value="zh-Hans">简体</option>
      <option value="en">EN</option>
    </select>
    <h1 id="pageTitle">上載定位影片</h1>
    <p id="pageSubtitle">分享您的視角與全息體驗</p>
    <label id="labelVideo">影片</label>
    <input id="file" type="file" accept="video/*">
    <label id="labelTitle">標題</label>
    <input id="title" type="text" placeholder="例如：澳門塔景觀">
    <label id="labelDesc">描述</label>
    <input id="desc" type="text" placeholder="簡短描述">
    <label id="labelLocation">實時定位</label>
    <div class="loc">
      <span id="status">未獲取位置<br><small id="coords">--.------, --.------</small></span>
      <button id="locate" type="button">當前位置</button>
      <button id="pick" type="button">選取地圖</button>
    </div>
    <button class="submit" id="submit" type="button">提交影片</button>
    <section id="receipt" class="receipt" hidden aria-labelledby="receiptTitle">
      <h2 id="receiptTitle" tabindex="-1">上傳成功，等待審批！</h2>
      <label id="trackingLabel" for="trackingId">上傳 ID</label>
      <textarea id="trackingId" rows="2" readonly spellcheck="false"></textarea>
      <div class="receipt-actions">
        <button id="copyId" type="button"><i data-lucide="copy" aria-hidden="true"></i><span id="copyIdText">複製 ID</span></button>
        <a id="receiptStatusLink" href="Upload-status.html">查詢審批狀態</a>
      </div>
      <p id="receiptNote"></p>
      <p id="copyMessage" role="status"></p>
    </section>
    <a id="statusLink" class="back" href="Upload-status.html">查詢上傳狀態</a>
    <a id="backLink" class="back" href="Holo-Map.html">返回全息地圖</a>
  </main>

  <div class="modal" id="modal">
    <div class="mapbox">
      <div class="maphead">
        <b id="mapTitle">點擊地圖選擇位置</b>
        <button id="close" type="button">關閉</button>
      </div>
      <div id="map" class="map"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const translations = {
      'zh-Hant': {
        pageTitle: '上載定位影片',
        pageSubtitle: '分享您的視角與全息體驗',
        labelVideo: '影片',
        labelTitle: '標題',
        labelDesc: '描述',
        labelLocation: '實時定位',
        locate: '當前位置',
        pick: '選取地圖',
        submit: '提交影片',
        backLink: '返回全息地圖',
        mapTitle: '點擊地圖選擇位置',
        close: '關閉',
        statusDefault: '未獲取位置',
        coordsDefault: '--.------, --.------',
        statusLoading: '正在定位...',
        statusPicked: '已獲取位置',
        errorLocation: '定位失敗: ',
        placeholderTitle: '例如：澳門塔景觀',
        placeholderDesc: '簡短描述',
        confirmDefault: '未獲取位置資訊，是否使用預設位置？',
        fileRequired: '請先選擇影片檔案！',
        uploadSuccess: '上傳成功，等待審批！',
        uploadError: '上傳失敗: ',
        uploading: '正在上傳...',
        statusLink: '查詢上傳狀態',
        trackingLabel: '上傳 ID',
        copyIdText: '複製 ID',
        receiptStatusLink: '查詢審批狀態',
        receiptNote: '請保留此 ID 或收藏查詢連結，以便隨時在任何裝置查看狀態。',
        localSuccess: '影片已儲存在此裝置',
        localNote: '這是本地預覽，未提交審批。此 ID 只能在目前瀏覽器查詢。',
        copied: 'ID 已複製',
        copyFallback: '請複製已選取的 ID。'
      },
      'zh-Hans': {
        pageTitle: '上传定位影片',
        pageSubtitle: '分享您的视角与全息体验',
        labelVideo: '影片',
        labelTitle: '标题',
        labelDesc: '描述',
        labelLocation: '实时定位',
        locate: '当前位置',
        pick: '选择地图',
        submit: '提交影片',
        backLink: '返回全息地图',
        mapTitle: '点击地图选择位置',
        close: '关闭',
        statusDefault: '未获取位置',
        coordsDefault: '--.------, --.------',
        statusLoading: '正在定位...',
        statusPicked: '已获取位置',
        errorLocation: '定位失败: ',
        placeholderTitle: '例如：澳门塔景观',
        placeholderDesc: '简短描述',
        confirmDefault: '未获取位置信息，是否使用默认位置？',
        fileRequired: '请先选择影片文件！',
        uploadSuccess: '上传成功，等待审批！',
        uploadError: '上传失败: ',
        uploading: '正在上传...',
        statusLink: '查询上传状态',
        trackingLabel: '上传 ID',
        copyIdText: '复制 ID',
        receiptStatusLink: '查询审批状态',
        receiptNote: '请保留此 ID 或收藏查询链接，以便随时在任何设备查看状态。',
        localSuccess: '影片已保存在此设备',
        localNote: '这是本地预览，未提交审批。此 ID 只能在当前浏览器查询。',
        copied: 'ID 已复制',
        copyFallback: '请复制已选中的 ID。'
      },
      en: {
        pageTitle: 'Upload geotagged video',
        pageSubtitle: 'Share your perspective and holographic experience',
        labelVideo: 'Video',
        labelTitle: 'Title',
        labelDesc: 'Description',
        labelLocation: 'Live location',
        locate: 'Current location',
        pick: 'Choose on map',
        submit: 'Submit video',
        backLink: 'Back to map',
        mapTitle: 'Click map to choose location',
        close: 'Close',
        statusDefault: 'Location not available',
        coordsDefault: '--.------, --.------',
        statusLoading: 'Locating...',
        statusPicked: 'Location acquired',
        errorLocation: 'Location failed: ',
        placeholderTitle: 'e.g. Macau Tower view',
        placeholderDesc: 'Short description',
        confirmDefault: 'No location info yet. Use default location?',
        fileRequired: 'Please select a video file first!',
        uploadSuccess: 'Upload successful, awaiting approval!',
        uploadError: 'Upload failed: ',
        uploading: 'Uploading...',
        statusLink: 'Check upload status',
        trackingLabel: 'Upload ID',
        copyIdText: 'Copy ID',
        receiptStatusLink: 'Check approval status',
        receiptNote: 'Keep this ID or bookmark the status link to check from any device at any time.',
        localSuccess: 'Video saved on this device',
        localNote: 'This is a local preview and has not been submitted for review. This ID works only in this browser.',
        copied: 'ID copied',
        copyFallback: 'Copy the selected ID.'
      }
    };

    const state = { lang: 'zh-Hant' };
    const langSelect = document.getElementById('langSelect');
    let uploadReceipt = null, uploading = false;

    function t(k){ return translations[state.lang][k]; }

    function applyLanguage(){
      ['pageTitle','pageSubtitle','labelVideo','labelTitle','labelDesc','labelLocation','locate','pick','submit','backLink','mapTitle','close','statusLink','trackingLabel','copyIdText','receiptStatusLink'].forEach(id => document.getElementById(id).textContent = t(id));
      document.documentElement.lang = state.lang;
      document.title = t('pageTitle');
      if (uploading) document.getElementById('submit').textContent = t('uploading');
      if (uploadReceipt) {
        document.getElementById('receiptTitle').textContent = t(uploadReceipt.is_local ? 'localSuccess' : 'uploadSuccess');
        document.getElementById('receiptNote').textContent = t(uploadReceipt.is_local ? 'localNote' : 'receiptNote');
      }
      document.getElementById('copyMessage').textContent = '';
      document.getElementById('statusLink').href = `Upload-status.html?lang=${state.lang}`;
      if (uploadReceipt) document.getElementById('receiptStatusLink').href = `Upload-status.html?lang=${state.lang}#id=${uploadReceipt.id}`;
      document.getElementById('title').placeholder = t('placeholderTitle');
      document.getElementById('desc').placeholder = t('placeholderDesc');
      langSelect.value = state.lang;
    }

    langSelect.addEventListener('change', (event) => {
      state.lang = event.target.value;
      applyLanguage();
    });

    let locationData=null,marker=null;
    const center=[22.186945,113.541765], modal=document.getElementById('modal'), map=L.map('map').setView(center,15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

    function setLoc(lat,lng,text){
      locationData={ latitude:Number(lat), longitude:Number(lng) };
      document.getElementById('status').innerHTML=`${text}<br><small id="coords">${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}</small>`;
      const pos=[lat,lng];
      if(marker) marker.setLatLng(pos);
      else {
        marker=L.marker(pos,{draggable:true,icon:L.divIcon({className:'',html:'<div class="user-pin"></div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map);
      }
      marker.off('dragend').on('dragend', e => {
        const p=e.target.getLatLng();
        setLoc(p.lat,p.lng,t('statusPicked') + ' (manual selection)');
      });
      map.setView(pos,17);
    }

    function locate(){
      if(!navigator.geolocation) return alert(t('errorLocation') + 'browser geolocation is not supported');
      document.getElementById('status').innerHTML=`${t('statusLoading')}<br><small id="coords">${t('coordsDefault')}</small>`;
      navigator.geolocation.getCurrentPosition(
        p => setLoc(p.coords.latitude,p.coords.longitude,t('statusPicked') + ' (current GPS)'),
        e => alert(t('errorLocation') + e.message),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    const q=new URLSearchParams(location.search);
    if(q.get('lat')&&q.get('lng')) setLoc(q.get('lat'),q.get('lng'),'Location acquired (from map)');

    document.getElementById('locate').onclick=locate;
    document.getElementById('pick').onclick=()=>{
      modal.classList.add('open');
      setTimeout(()=>map.invalidateSize(),50);
    };
    document.getElementById('close').onclick=()=>modal.classList.remove('open');
    map.on('click', e => setLoc(e.latlng.lat,e.latlng.lng,'Location acquired (manual selection)'));

    document.getElementById('copyId').onclick=async()=>{
      const input=document.getElementById('trackingId');
      try {
        await navigator.clipboard.writeText(input.value);
        document.getElementById('copyMessage').textContent=t('copied');
      } catch (error) {
        input.focus();
        input.select();
        document.getElementById('copyMessage').textContent=t('copyFallback');
      }
    };

    document.getElementById('submit').onclick=async()=>{
      if(uploading) return;
      const f=document.getElementById('file').files[0];
      if(!f) return alert(t('fileRequired'));
      if(!locationData){
        if(!confirm(t('confirmDefault'))) return;
        locationData={ latitude:center[0], longitude:center[1] };
      }

      const b=document.getElementById('submit');
      uploading=true;
      b.disabled=true;
      b.textContent=t('uploading');
      try {
        const record=await window.HoloMapAPI.uploadVideo({
          title: document.getElementById('title').value.trim() || 'Holographic location video',
          description: document.getElementById('desc').value.trim(),
          file: f,
          lat: locationData.latitude,
          lng: locationData.longitude
        });
        uploadReceipt=record;
        document.getElementById('trackingId').value=record.id;
        document.getElementById('receipt').hidden=false;
        document.getElementById('file').value='';
        try { localStorage.setItem('holoMapLastUploadId',record.id); } catch (error) {}
        document.getElementById('receiptTitle').focus();
      } catch (e) {
        alert(t('uploadError') + e.message);
      } finally {
        uploading=false;
        b.disabled=false;
        applyLanguage();
      }
    };

    if(translations[q.get('lang')]) state.lang=q.get('lang');
    applyLanguage();
    if(window.lucide) lucide.createIcons();
  </script>
</body>
</html>
