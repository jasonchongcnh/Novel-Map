<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上載影片</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;margin:0;padding:24px;color:#0f172a}.box{max-width:560px;margin:auto;background:#fff;padding:28px;border:1px solid #cbd5e1;border-radius:20px;box-shadow:0 12px 32px #64748b33}h1{margin-top:0}label{display:block;margin:18px 0 6px;font-weight:700;color:#475569}input,button{font:inherit}input[type=text],input[type=file]{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}.loc{display:flex;gap:10px;align-items:center;padding:12px;background:#f1f5f9;border-radius:10px}.loc span{flex:1;color:#475569}button{padding:10px 14px;border:0;border-radius:8px;background:#0ea5e9;color:#fff;cursor:pointer}button:disabled{opacity:.5}.submit{width:100%;margin-top:22px;font-weight:700}.back{display:block;text-align:center;margin-top:18px;color:#0284c7}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.mapbox{width:90%;max-width:800px;height:75vh;background:#fff;border-radius:14px;overflow:hidden}.map{height:calc(100% - 56px)}.maphead{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;box-sizing:border-box}</style></head><body><main class="box"><h1>上載定位影片</h1><p>分享您的視角與全息體驗</p><label>影片</label><input id="file" type="file" accept="video/*"><label>標題</label><input id="title" type="text" placeholder="例如：澳門塔景觀"><label>描述</label><input id="desc" type="text" placeholder="簡短描述"><label>實時定位</label><div class="loc"><span id="status">未獲取位置<br><small id="coords">--.------, --.------</small></span><button id="locate">獲取位置</button><button id="pick">選取地圖</button></div><button class="submit" id="submit">提交影片</button><a class="back" href="Holo-Map.html">返回全息地圖</a></main><div class="modal" id="modal"><div class="mapbox"><div class="maphead"><b>點擊地圖選擇位置</b><button id="close">關閉</button></div><div id="map" class="map"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>
let locationData=null,marker=null;const center=[22.186945,113.541765],modal=document.getElementById('modal'),map=L.map('map').setView(center,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);function setLoc(lat,lng,text){locationData={latitude:Number(lat),longitude:Number(lng)};document.getElementById('status').textContent=text;document.getElementById('coords').textContent=`${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}`;if(marker)marker.setLatLng([lat,lng]);else marker=L.marker([lat,lng],{draggable:true}).addTo(map);marker.on('dragend',e=>{const p=e.target.getLatLng();setLoc(p.lat,p.lng,'已獲取位置 (手動選取)')})}const q=new URLSearchParams(location.search);if(q.get('lat')&&q.get('lng'))setLoc(q.get('lat'),q.get('lng'),'已獲取位置 (來自地圖)');document.getElementById('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude,'已獲取位置 (瀏覽器 GPS)'),e=>alert('定位失敗: '+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0}):alert('您的瀏覽器不支援地理定位');document.getElementById('pick').onclick=()=>{modal.classList.add('open');setTimeout(()=>map.invalidateSize(),50)};document.getElementById('close').onclick=()=>modal.classList.remove('open');map.on('click',e=>setLoc(e.latlng.lat,e.latlng.lng,'已獲取位置 (手動選取)'));document.getElementById('submit').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return alert('請先選擇影片檔案！');if(!locationData){if(!confirm('未獲取位置資訊，是否使用預設位置？'))return;locationData={latitude:center[0],longitude:center[1]}}const b=document.getElementById('submit');b.disabled=true;b.textContent='上傳中...';try{await window.HoloMapAPI.uploadVideo({title:document.getElementById('title').value.trim()||'全息定位影片',description:document.getElementById('desc').value.trim(),file:f,lat:locationData.latitude,lng:locationData.longitude});alert('上傳成功，等待審批！');location.href='Holo-Map.html'}catch(e){alert('上傳失敗: '+e.message);b.disabled=false;b.textContent='提交影片'}};
</script></body></html>
