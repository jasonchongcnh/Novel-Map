<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上載影片</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;margin:0;padding:24px;color:#0f172a}.box{max-width:560px;margin:auto;background:#fff;padding:28px;border:1px solid #cbd5e1;border-radius:20px;box-shadow:0 12px 32px #64748b33;position:relative}.lang-toggle{position:absolute;top:18px;right:18px;padding:8px 12px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;cursor:pointer;font-family:inherit}.box h1,.box>p{padding-right:110px}h1{margin-top:0}label{display:block;margin:18px 0 6px;font-weight:700;color:#475569}input,button{font:inherit}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}.loc{display:flex;gap:8px;align-items:center;padding:12px;background:#f1f5f9;border-radius:10px}.loc span{flex:1;color:#475569}button{padding:10px 14px;border:0;border-radius:8px;background:#0ea5e9;color:#fff;cursor:pointer}button:disabled{opacity:.5}.submit{width:100%;margin-top:22px;font-weight:700}.back{display:block;text-align:center;margin-top:18px;color:#0284c7}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.mapbox{width:90%;max-width:800px;height:75vh;background:#fff;border-radius:14px;overflow:hidden}.map{height:calc(100% - 56px)}.maphead{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;box-sizing:border-box}.user-pin{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 5px #2563eb55,0 2px 6px #0008}</style></head><body><main class="box"><button id="langToggle" class="lang-toggle" type="button">繁體 / 简体</button><h1 id="pageTitle">上載定位影片</h1><p id="pageSubtitle">分享您的視角與全息體驗</p><label id="labelVideo">影片</label><input id="file" type="file" accept="video/*"><label id="labelTitle">標題</label><input id="title" type="text" placeholder="例如：澳門塔景觀"><label id="labelDesc">描述</label><input id="desc" type="text" placeholder="簡短描述"><label id="labelLocation">實時定位</label><div class="loc"><span id="status">未獲取位置<br><small id="coords">--.------, --.------</small></span><button id="locate">當前位置</button><button id="pick">選取地圖</button></div><button class="submit" id="submit">提交影片</button><a id="backLink" class="back" href="Holo-Map.html">返回全息地圖</a></main><div class="modal" id="modal"><div class="mapbox"><div class="maphead"><b id="mapTitle">點擊地圖選擇位置</b><button id="close">關閉</button></div><div id="map" class="map"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>const translations={'zh-Hant':{pageTitle:'上載定位影片',pageSubtitle:'分享您的視角與全息體驗',labelVideo:'影片',labelTitle:'標題',labelDesc:'描述',labelLocation:'實時定位',locate:'當前位置',pick:'選取地圖',submit:'提交影片',backLink:'返回全息地圖',mapTitle:'點擊地圖選擇位置',close:'關閉',statusDefault:'未獲取位置',coordsDefault:'--.------, --.------',statusLoading:'正在定位...',statusPicked:'已獲取位置',errorLocation:'定位失敗: ',placeholderTitle:'例如：澳門塔景觀',placeholderDesc:'簡短描述',confirmDefault:'未獲取位置資訊，是否使用預設位置？',fileRequired:'請先選擇影片檔案！',uploadSuccess:'上傳成功，等待審批！',uploadError:'上傳失敗: '},'zh-Hans':{pageTitle:'上传定位影片',pageSubtitle:'分享您的视角与全息体验',labelVideo:'影片',labelTitle:'标题',labelDesc:'描述',labelLocation:'实时定位',locate:'当前位置',pick:'选择地图',submit:'提交影片',backLink:'返回全息地图',mapTitle:'点击地图选择位置',close:'关闭',statusDefault:'未获取位置',coordsDefault:'--.------, --.------',statusLoading:'正在定位...',statusPicked:'已获取位置',errorLocation:'定位失败: ',placeholderTitle:'例如：澳门塔景观',placeholderDesc:'简短描述',confirmDefault:'未获取位置信息，是否使用默认位置？',fileRequired:'请先选择影片文件！',uploadSuccess:'上传成功，等待审批！',uploadError:'上传失败: '}};const state={lang:'zh-Hant'};function t(k){return translations[state.lang][k]}function applyLanguage(){['pageTitle','pageSubtitle','labelVideo','labelTitle','labelDesc','labelLocation','locate','pick','submit','backLink','mapTitle','close'].forEach(id=>document.getElementById(id).textContent=t(id));document.getElementById('title').placeholder=t('placeholderTitle');document.getElementById('desc').placeholder=t('placeholderDesc');document.getElementById('langToggle').textContent=state.lang==='zh-Hant'?'繁體 / 简体':'简体 / 繁體'}document.getElementById('langToggle').onclick=()=>{state.lang=state.lang==='zh-Hant'?'zh-Hans':'zh-Hant';applyLanguage()};let locationData=null,marker=null,circle=null;const center=[22.186945,113.541765],modal=document.getElementById('modal'),map=L.map('map').setView(center,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);function setLoc(lat,lng,text,accuracy){locationData={latitude:Number(lat),longitude:Number(lng)};document.getElementById('status').innerHTML=`${text}<br><small id="coords">${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}</small>`;const pos=[lat,lng];if(marker)marker.setLatLng(pos);else marker=L.marker(pos,{draggable:true,icon:L.divIcon({className:'',html:'<div class="user-pin"></div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map);if(circle)circle.setLatLng(pos);if(accuracy){if(!circle)circle=L.circle(pos,{radius:accuracy,color:'#2563eb',fillColor:'#2563eb',fillOpacity:.12,weight:1}).addTo(map);else circle.setRadius(accuracy)}marker.off('dragend').on('dragend',e=>{const p=e.target.getLatLng();setLoc(p.lat,p.lng,t('statusPicked')+' (手動選取)')});map.setView(pos,17)}function locate(){if(!navigator.geolocation)return alert(t('errorLocation')+'瀏覽器不支援地理定位');document.getElementById('status').innerHTML=`${t('statusLoading')}<br><small id="coords">${t('coordsDefault')}</small>`;navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude,t('statusPicked')+' (當前 GPS)',p.coords.accuracy),e=>alert(t('errorLocation')+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}const q=new URLSearchParams(location.search);if(q.get('lat')&&q.get('lng'))setLoc(q.get('lat'),q.get('lng'),'已獲取位置 (來自地圖)');document.getElementById('locate').onclick=locate;document.getElementById('pick').onclick=()=>{modal.classList.add('open');setTimeout(()=>map.invalidateSize(),50)};document.getElementById('close').onclick=()=>modal.classList.remove('open');map.on('click',e=>setLoc(e.latlng.lat,e.latlng.lng,'已獲取位置 (手動選取)'));document.getElementById('submit').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return alert(t('fileRequired'));if(!locationData){if(!confirm(t('confirmDefault')))return;locationData={latitude:center[0],longitude:center[1]}}const b=document.getElementById('submit');b.disabled=true;b.textContent='上傳中...';try{await window.HoloMapAPI.uploadVideo({title:document.getElementById('title').value.trim()||'全息定位影片',description:document.getElementById('desc').value.trim(),file:f,lat:locationData.latitude,lng:locationData.longitude});alert(t('uploadSuccess'));location.href='Holo-Map.html'}catch(e){alert(t('uploadError')+e.message);b.disabled=false;b.textContent=t('submit')}};applyLanguage();</script></body></html>
